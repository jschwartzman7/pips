<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="styles.css"/>
    <title>Pips Program</title>
</head>
<body>
    <h1>Pips Program</h1>
    <button data-type="solvePuzzleButton" id="solvePuzzleButton">Solve Puzzle</button>
    <div id="boardContainer"></div>
    <div id="dominosContainer"></div>
    <div id="addConstraintContainer">
        <div data-type="addConstraintButton" id="addConstraintButton">Add Constraint</div>
        <input id="newConstraintType" class="constraintInput" placeholder="type">
        <input id="newConstraintValue" class="constraintInput" placeholder="value">
    </div>
    <div id="constraintsContainer"></div>
    <script src="uiDisplay/boardDisplay.js"></script>
    <script src="uiDisplay/dominosDisplay.js"></script>
    <script src="uiDisplay/constraintsDisplay.js"></script>
    <script src="presetConfigs.js"></script>
    <script src="pipsSolver.js"></script>
    <script src="pipsState.js"></script>
    <script src="EventManager.js"></script>
    <script src="main.js"></script>
</body>
</html>
